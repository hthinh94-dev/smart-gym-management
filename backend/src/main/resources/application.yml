spring:
  application:
    name: smart-gym-api

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/smart_gym_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
    username: root
    password: thinh2005
    hikari:
      connection-init-sql: "SET time_zone = '+00:00'"

  jpa:
    open-in-view: false
